name: Deploy to GitHub Pages

# WHY: Deploy only code that passed CI; a red main must never reach the public demo.
on:
  workflow_run:
    workflows: [ "CI" ]
    types: [ completed ]
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # WHY: Deploy exactly the commit CI validated, not whatever main points to now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install WASM Tools
        run: dotnet workload install wasm-tools

      - name: Publish WASM
        run: dotnet publish UoMConverter.Wasm/UoMConverter.Wasm.csproj -c Release -o release --nologo

      # WHY: no path patching; index.html, sw.js and the manifest use only relative URLs (<base href="./">).
      # Copy index.html to 404.html to support client-side routing
      - name: Fix Routing
        run: cp release/wwwroot/index.html release/wwwroot/404.html

      # Add .nojekyll to ensure _framework files are served
      - name: Add .nojekyll
        run: touch release/wwwroot/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'release/wwwroot'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
