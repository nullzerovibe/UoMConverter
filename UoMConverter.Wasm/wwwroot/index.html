        <script type="module">
            // --- DYNAMIC FILENAME RESOLVER ---
            // Automatically finds the fingerprinted blazor.webassembly.js from the importmap
            globalThis.blazorInit = new Promise((resolve) => {
                let retries = 0;
                const maxRetries = 20;

                const loadEngine = () => {
                    const mapTag = document.querySelector('script[type="importmap"]');
                    let url = "_framework/blazor.webassembly.js"; // Standard fallback

                    if (mapTag && mapTag.textContent.trim().length > 0) {
                        try {
                            const map = JSON.parse(mapTag.textContent);
                            url = map.imports["./_framework/blazor.webassembly.js"] || url;
                            console.log("UoMConverter: Importmap found. Resolved URL:", url);
                        } catch (e) {
                            console.error("UoMConverter: Failed to parse importmap:", e);
                        }
                    } else if (retries < maxRetries) {
                        retries++;
                        setTimeout(loadEngine, 100);
                        return;
                    } else {
                        console.warn("UoMConverter: Importmap not found/empty after timeout. Using fallback:", url);
                    }

                    console.log("UoMConverter: Injecting script tag for:", url);
                    const script = document.createElement('script');
                    script.src = url;
                    script.type = "module";
                    script.setAttribute('autostart', 'false');
                    script.onload = () => {
                        console.log("UoMConverter: Script loaded. Starting Blazor...");
                        resolve(Blazor.start());
                    };
                    script.onerror = (e) => console.error("UoMConverter: Failed to load script:", url, e);
                    document.body.appendChild(script);
                };
                loadEngine();
            });

            async function getInterop() {
                if (globalThis.uomConverter) return globalThis.uomConverter;
                // Wait for registration
                while (!globalThis.uomConverter) {
                    await new Promise(r => setTimeout(r, 50));
                }
                return globalThis.uomConverter;
            }

            // Initialize UI after Wasm is ready
            await globalThis.blazorInit;
            const status = document.getElementById('status');
            status.textContent = "Engine Ready";
            status.classList.add('ready');

            console.log("UoMConverter: Waiting for interop registration...");
            try {
                const interop = await getInterop();
                const pong = await interop.invokeMethodAsync('Ping');
                console.log("UoMConverter: Interop connection successful:", pong);
            } catch (e) {
                console.error("UoMConverter: Interop Ping failed:", e);
            }

            // Fetch and display version
            try {
                const interop = await getInterop();
                const version = await interop.invokeMethodAsync('GetVersion');
                if (version) {
                    document.getElementById('appVersion').textContent = `(v${version})`;
                }
            } catch (verErr) {
                console.warn("UoMConverter: Could not fetch version", verErr);
            }

            await populateDimensions();
            document.getElementById('convertBtn').disabled = false;

            async function populateDimensions() {
                try {
                    const select = document.getElementById('dimensionSelect');
                    const interop = await getInterop();
                    const dims = await interop.invokeMethodAsync('GetDimensions');

                    if (!dims || dims.length === 0) {
                        console.warn("UoMConverter: Received empty dimensions list.");
                        return;
                    }

                    dims.sort().forEach(d => {
                        const opt = document.createElement('option');
                        opt.value = d;
                        opt.textContent = d;
                        select.appendChild(opt);
                    });

                    // Setup Custom Key-Value Dropdown
                    setupCustomDimDropdown('dimensionContainer', 'dimensionInput', 'dimensionList', 'dimensionSelect', dims);
                } catch (err) {
                    console.error("UoMConverter: populateDimensions failed:", err);
                    const status = document.getElementById('status');
                    status.textContent = "Engine Error";
                    status.style.background = "var(--error)";
                }
            }

            async function loadUnitsForDimension(dim) {
                const interop = await getInterop();
                const units = await interop.invokeMethodAsync('GetUnits', dim);

                const fromSelect = document.getElementById('fromUnitSelect');
                const toSelect = document.getElementById('toUnitSelect');

                [fromSelect, toSelect].forEach(s => {
                    s.innerHTML = '<option value="" disabled selected>Unit...</option>';
                    units.sort((a, b) => a.name.localeCompare(b.name)).forEach(u => {
                        const opt = document.createElement('option');
                        opt.value = u.abbreviation || u.name;
                        opt.textContent = `${u.name} (${u.abbreviation || '?'})`;
                        s.appendChild(opt);
                    });
                    s.disabled = false;
                });

                // Unlock inputs
                document.getElementById('valueInput').disabled = false;
                document.getElementById('fromUnitInput').disabled = false;
                document.getElementById('toUnitInput').disabled = false;
                document.getElementById('swapBtn').disabled = false;

                // Populate Custom Dropdowns
                setupCustomDropdown('fromUnitContainer', 'fromUnitInput', 'fromUnitList', 'fromUnitSelect', units);
                setupCustomDropdown('toUnitContainer', 'toUnitInput', 'toUnitList', 'toUnitSelect', units);
            }

            function setupCustomDropdown(containerId, inputId, listId, selectId, units) {
                const container = document.getElementById(containerId);
                const input = document.getElementById(inputId);
                const list = document.getElementById(listId);
                const select = document.getElementById(selectId);

                let allOptions = units.map(u => ({
                    value: u.abbreviation || u.name,
                    label: `${u.name} (${u.abbreviation || '-'})`,
                    abbr: u.abbreviation
                }));

                // Render list function
                const renderList = (filterText = '') => {
                    list.innerHTML = '';
                    const filtered = allOptions.filter(o =>
                        o.label.toLowerCase().includes(filterText.toLowerCase())
                    );

                    if (filtered.length === 0) {
                        list.innerHTML = '<div class="no-results">No units found</div>';
                        return;
                    }

                    filtered.forEach(opt => {
                        const div = document.createElement('div');
                        div.className = 'custom-option';
                        div.textContent = opt.label;
                        if (input.value === opt.label) div.classList.add('selected');

                        div.onclick = async () => {
                            input.value = opt.label;
                            select.value = opt.value;
                            list.classList.remove('open');

                            // Trigger conversion if both selected
                            const otherSelectId = selectId === 'fromUnitSelect' ? 'toUnitSelect' : 'fromUnitSelect';
                            if (document.getElementById(otherSelectId).value) {
                                await globalThis.convert();
                            }
                        };
                        list.appendChild(div);
                    });
                };

                // Input events
                input.onfocus = () => {
                    renderList();
                    list.classList.add('open');
                };

                input.oninput = () => {
                    renderList(input.value);
                    list.classList.add('open');
                };

                // Click outside to close
                document.addEventListener('click', (e) => {
                    if (!container.contains(e.target)) {
                        list.classList.remove('open');
                        // Restore valid value if input is invalid
                        const currentVal = select.value;
                        if (currentVal) {
                            const opt = allOptions.find(o => o.value === currentVal);
                            if (opt) input.value = opt.label;
                        } else {
                            input.value = '';
                        }
                    }
                });
            }

            function setupCustomDimDropdown(containerId, inputId, listId, selectId, dims) {
                const container = document.getElementById(containerId);
                const input = document.getElementById(inputId);
                const list = document.getElementById(listId);
                const select = document.getElementById(selectId);

                // Render list
                const renderList = (filterText = '') => {
                    list.innerHTML = '';
                    const filtered = dims.filter(d => d.toLowerCase().includes(filterText.toLowerCase()));

                    if (filtered.length === 0) {
                        list.innerHTML = '<div class="no-results">No quantities found</div>';
                        return;
                    }

                    filtered.forEach(d => {
                        const div = document.createElement('div');
                        div.className = 'custom-option';
                        div.textContent = d;
                        if (input.value === d) div.classList.add('selected');

                        div.onclick = async () => {
                            input.value = d;
                            select.value = d;
                            list.classList.remove('open');
                            await loadUnitsForDimension(d);
                        };
                        list.appendChild(div);
                    });
                };

                input.onfocus = () => {
                    renderList();
                    list.classList.add('open');
                };

                input.oninput = () => {
                    renderList(input.value);
                    list.classList.add('open');
                };

                document.addEventListener('click', (e) => {
                    if (!container.contains(e.target)) {
                        list.classList.remove('open');
                    }
                });
            }

            document.getElementById('dimensionSelect').onchange = async (e) => {
                await loadUnitsForDimension(e.target.value);
            };

            // Example Loaded Logic
            // Example Loaded Logic
            const exampleSelect = document.getElementById('exampleSelect');
            exampleSelect.onchange = async (e) => {
                const ex = JSON.parse(e.target.value);
                await loadExample(ex);
            };

            // Setup Custom Example Dropdown
            function setupCustomExampleDropdown() {
                const container = document.getElementById('exampleContainer');
                const input = document.getElementById('exampleInput');
                const list = document.getElementById('exampleList');
                const select = document.getElementById('exampleSelect');

                // Extract options from select
                const options = Array.from(select.options)
                    .filter(o => !o.disabled)
                    .map(o => ({
                        value: o.value,
                        text: o.textContent
                    }));

                const renderList = (filterText = '') => {
                    list.innerHTML = '';
                    const filtered = options.filter(o => o.text.toLowerCase().includes(filterText.toLowerCase()));

                    if (filtered.length === 0) {
                        list.innerHTML = '<div class="no-results">No examples found</div>';
                        return;
                    }

                    filtered.forEach(opt => {
                        const div = document.createElement('div');
                        div.className = 'custom-option';
                        div.textContent = opt.text;

                        div.onclick = async () => {
                            input.value = opt.text;
                            select.value = opt.value;
                            list.classList.remove('open');

                            // Trigger logic
                            const ex = JSON.parse(opt.value);
                            await loadExample(ex);
                        };
                        list.appendChild(div);
                    });
                };

                input.onfocus = () => {
                    renderList();
                    list.classList.add('open');
                };

                input.oninput = () => {
                    renderList(input.value);
                    list.classList.add('open');
                };

                document.addEventListener('click', (e) => {
                    if (!container.contains(e.target)) {
                        list.classList.remove('open');
                    }
                });
            }

            // Initialize Example Dropdown
            setupCustomExampleDropdown();

            async function loadExample(ex) {
                // 1. Select Dimension
                await selectDimension(ex.dim);

                // 2. Wait for units to populate (selectDimension waits for loadUnitsForDimension)
                // We need to find the correct value (Abbr or Name) for the select options.
                // Our presets use 'Name' (e.g. 'Meter'), but option value might be 'm'.

                const fromSelect = document.getElementById('fromUnitSelect');
                const toSelect = document.getElementById('toUnitSelect');

                const setSelectByText = (select, textOrName) => {
                    // Try to match value first (if name matches value directly)
                    // Then try to match text content (Name (Abbr))
                    // Then try to match just Name part of text

                    // Direct value match?
                    for (let i = 0; i < select.options.length; i++) {
                        if (select.options[i].value === textOrName) {
                            select.selectedIndex = i;
                            return true;
                        }
                    }

                    // Scan options for name match
                    const targetName = textOrName.toLowerCase();
                    for (let i = 0; i < select.options.length; i++) {
                        const optText = select.options[i].textContent.toLowerCase();
                        // Format is "Name (Abbr)"
                        if (optText.startsWith(targetName + " ") || optText === targetName) {
                            select.selectedIndex = i;
                            return true;
                        }
                    }
                    return false;
                };

                // Helper to smart select
                // Ideally our presets should match the Name used in generation.
                // UnitsNet names are PascalCase usually.

                // Let's try to set it.
                // Wait a tick ensures UI is fresh if selectDimension was async.
                setTimeout(async () => {
                    let f = setSelectByText(fromSelect, ex.from);
                    let t = setSelectByText(toSelect, ex.to);

                    if (!f) console.warn(`Could not find unit: ${ex.from}`);
                    if (!t) console.warn(`Could not find unit: ${ex.to}`);

                    document.getElementById('valueInput').value = ex.val;

                    if (f && t) {
                        await globalThis.convert();
                    }
                }, 50);

                // Update Custom Inputs
                const updateCustom = (selectId, inputId) => {
                    const sel = document.getElementById(selectId);
                    const inp = document.getElementById(inputId);
                    if (sel.value && sel.selectedIndex >= 0) {
                        inp.value = sel.options[sel.selectedIndex].text;
                    }
                };

                // Wait little more for select logic to finish
                setTimeout(() => {
                    updateCustom('dimensionSelect', 'dimensionInput');
                    updateCustom('fromUnitSelect', 'fromUnitInput');
                    updateCustom('toUnitSelect', 'toUnitInput');
                }, 60);
            }

            // Programmatic Selection Helpers
            async function selectDimension(dim) {
                const select = document.getElementById('dimensionSelect');
                select.value = dim;

                // Update custom input
                const input = document.getElementById('dimensionInput');
                if (input) input.value = dim;

                await loadUnitsForDimension(dim);
                document.getElementById('docsModal').style.display = 'none';
            }

            async function selectUnit(dim, unitNameOrAbbr) {
                await selectDimension(dim);
                // Wait a tick for options to populate
                setTimeout(() => {
                    const fromSelect = document.getElementById('fromUnitSelect');
                    // Try to find by value (abbr or name)
                    // The option values are set to (abbr || name) in loadUnitsForDimension
                    // We need to match what's in the dropdown. 
                    // Since we don't know if the doc click logic passes an abbr or name, we might need to be smart.
                    // For now, let's assume the doc click logic passes the correct value.
                    fromSelect.value = unitNameOrAbbr;
                    // Trigger change if needed, but for now just setting value is enough for user to see
                }, 50);
            }

            // Result Formatting
            function formatResult(num) {
                if (num === 0) return "0";
                const abs = Math.abs(num);
                // Use scientific notation for very small or very large numbers
                if (abs < 1e-6 || abs >= 1e9) {
                    return num.toExponential(4).replace('e+', 'e');
                }
                // Otherwise use standard locale string with appropriate precision
                return num.toLocaleString(undefined, { maximumFractionDigits: 6 });
            }

            // History & Copy Logic
            let history = [];
            const MAX_HISTORY = 10; // Increased to 10 for persistence

            // Load history on startup
            try {
                const saved = localStorage.getItem('uom_history');
                if (saved) {
                    history = JSON.parse(saved);
                    if (history.length > 0) {
                        document.getElementById('historyContainer').style.display = 'block';
                        // Defer render until DOM is fully ready if needed, usually fine here
                        setTimeout(renderHistory, 0);
                    }
                }
            } catch (e) {
                console.error("Failed to load history:", e);
            }

            globalThis.clearHistory = () => {
                history = [];
                localStorage.removeItem('uom_history');
                document.getElementById('historyContainer').style.display = 'none';
                document.getElementById('historyList').innerHTML = '';
            };

            function updateHistory(val, from, to, result, dim) {
                const container = document.getElementById('historyContainer');
                container.style.display = 'block';

                const entry = { val, from, to, result, dim, time: new Date() };
                history.unshift(entry);
                if (history.length > MAX_HISTORY) history.pop();

                // Save to localStorage
                localStorage.setItem('uom_history', JSON.stringify(history));

                renderHistory();
            }

            function renderHistory() {
                const list = document.getElementById('historyList');
                list.innerHTML = history.map((h, i) => `
                    <div class="history-item" onclick="restoreHistory(${i})" title="Click to restore">
                        <span class="hist-detail">${h.val} ${h.from} = </span>
                        <span class="hist-result">${formatResult(h.result)} ${h.to}</span>
                    </div>
                `).join('');
            }

            globalThis.restoreHistory = async (index) => {
                const item = history[index];
                if (!item) return;

                // 1. Set Dimension
                await selectDimension(item.dim);

                // 2. Set Units & Value
                // Verify options exist before setting
                const fromSelect = document.getElementById('fromUnitSelect');
                const toSelect = document.getElementById('toUnitSelect');

                // Allow UI to populate
                setTimeout(async () => {
                    fromSelect.value = item.from;
                    toSelect.value = item.to;
                    document.getElementById('valueInput').value = item.val;

                    // 3. Trigger Conversion
                    // await globalThis.convert();
                }, 100);
            };

            const copyBtn = document.getElementById('copyBtn');
            copyBtn.onclick = () => {
                const text = document.getElementById('resultValue').textContent;
                navigator.clipboard.writeText(text).then(() => {
                    const original = copyBtn.innerHTML;
                    copyBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 1.2rem; height: 1.2rem;"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
                    setTimeout(() => {
                        copyBtn.innerHTML = original;
                    }, 1500);
                });
            };

            globalThis.convert = async () => {
                const val = Number.parseFloat(document.getElementById('valueInput').value);
                const dim = document.getElementById('dimensionSelect').value;
                const from = document.getElementById('fromUnitSelect').value;
                const to = document.getElementById('toUnitSelect').value;
                const outVal = document.getElementById('resultValue');
                const outLabel = document.getElementById('resultLabel');
                const timer = document.getElementById('execTimer');
                const copyBtn = document.getElementById('copyBtn');

                if (!from || !to || Number.isNaN(val)) return;

                outLabel.textContent = "Converting...";

                // Client-side timing
                const startTime = performance.now();

                try {
                    const interop = await getInterop();
                    // Pass dimension to resolve ambiguities (e.g. 'A' for Ampere vs Angstrom)
                    // Also pass useSmartDetection=true (default) to allow implicit resolution if dimension is empty
                    const useSmartDetection = true;
                    const res = await interop.invokeMethodAsync('Convert', val, from, to, dim, useSmartDetection);

                    const endTime = performance.now();
                    const duration = (endTime - startTime).toFixed(1);

                    if (res.success) {
                        outVal.textContent = formatResult(res.value);
                        outLabel.textContent = `Successfully converted to ${to}`;
                        outLabel.style.color = '';

                        // Update UI Elements
                        copyBtn.style.display = 'block'; // Block because it is icon-btn now
                        timer.style.display = 'block';
                        timer.textContent = `${duration}ms`;

                        // Update History
                        // Avoid duplicates at the top
                        if (history.length === 0 ||
                            (history[0].val !== val || history[0].from !== from || history[0].to !== to || history[0].dim !== dim)) {
                            updateHistory(val, from, to, res.value, dim);
                        }
                    } else {
                        outVal.textContent = "Error";
                        outLabel.textContent = res.error;
                        outLabel.style.color = 'var(--error)';
                        copyBtn.style.display = 'none';
                        timer.style.display = 'none';
                    }
                } catch (err) {
                    outVal.textContent = "Interop Error";
                    outLabel.textContent = err.message;
                    copyBtn.style.display = 'none';
                    timer.style.display = 'none';
                }
            };

            // Swap Logic
            document.getElementById('swapBtn').onclick = async () => {
                const fromSelect = document.getElementById('fromUnitSelect');
                const toSelect = document.getElementById('toUnitSelect');
                const fromInput = document.getElementById('fromUnitInput');
                const toInput = document.getElementById('toUnitInput');

                if (fromSelect.disabled || toSelect.disabled) return;

                const fromVal = fromSelect.value;
                const toVal = toSelect.value;

                fromSelect.value = toVal;
                toSelect.value = fromVal;

                // Update Inputs text
                const tempText = fromInput.value;
                fromInput.value = toInput.value;
                toInput.value = tempText;

                // Trigger conversion if both valid
                if (fromSelect.value && toSelect.value) {
                    await globalThis.convert();
                }
            };

            // Keyboard Shortcuts
            document.addEventListener('keydown', async (e) => {
                // Enter to Convert (if not in a textarea/button)
                if (e.key === 'Enter' && e.target.tagName !== 'BUTTON' && e.target.tagName !== 'TEXTAREA') {
                    // Start conversion if button enabled
                    const btn = document.getElementById('convertBtn');
                    if (!btn.disabled) {
                        e.preventDefault();
                        await globalThis.convert();
                    }
                }

                // Alt+S to Swap
                if (e.altKey && e.code === 'KeyS') {
                    e.preventDefault();
                    document.getElementById('swapBtn').click();
                }
            });

            document.getElementById('convertBtn').onclick = globalThis.convert;

            // -- Documentation Logic --
            const docsModal = document.getElementById('docsModal');
            const docsBtn = document.getElementById('docsBtn');
            const closeDocsBtn = document.getElementById('closeDocsBtn');
            const docsBody = document.getElementById('docsBody');

            const closeDocs = () => {
                docsModal.style.display = 'none';
            };

            closeDocsBtn.onclick = closeDocs;

            // Close when clicking outside content
            docsModal.onclick = (e) => {
                if (e.target === docsModal) closeDocs();
            };

            // Close on Esc key
            globalThis.addEventListener('keydown', (e) => {
                if (e.key === "Escape" && docsModal.style.display === 'flex') {
                    closeDocs();
                }
            });

            let allDocs = [];
            const docSearch = document.getElementById('docSearch');
            const docDimFilter = document.getElementById('docDimFilter');

            docsBtn.onclick = async () => {
                docsModal.style.display = 'flex';
                if (docsBody.dataset.loaded) return;

                try {
                    docsBody.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 2rem;">Loading...</div>';
                    const interop = await getInterop();
                    const json = await interop.invokeMethodAsync('GetDocumentation');
                    allDocs = JSON.parse(json);

                    // Initial Sort
                    allDocs.sort((a, b) => a.Name.localeCompare(b.Name));
                    allDocs.forEach(d => d.Units.sort((a, b) => a.Name.localeCompare(b.Name)));

                    populateDimFilter();
                    filterAndRenderDocs();

                    docsBody.dataset.loaded = 'true';
                } catch (e) {
                    docsBody.innerHTML = `<div style="color: var(--error); padding: 1rem;">Failed to load docs: ${e.message}</div>`;
                    console.error(e);
                }
            };

            function populateDimFilter() {
                docDimFilter.innerHTML = '<option value="all">All Dimensions</option>';
                allDocs.forEach(d => {
                    const opt = document.createElement('option');
                    opt.value = d.Name;
                    opt.textContent = d.Name;
                    docDimFilter.appendChild(opt);
                });
            }

            function filterAndRenderDocs() {
                const search = docSearch.value.toLowerCase().trim();
                const dim = docDimFilter.value;

                const filtered = allDocs.map(d => {
                    // 1. Dimension Filter
                    if (dim !== 'all' && d.Name !== dim) return null;

                    // 2. Search Filter
                    if (search) {
                        const dimMatch = d.Name.toLowerCase().includes(search);
                        const matchingUnits = d.Units.filter(u =>
                            u.Name.toLowerCase().includes(search) ||
                            (u.Abbr && u.Abbr.some(a => a.toLowerCase().includes(search)))
                        );

                        if (dimMatch) {
                            return d;
                        } else if (matchingUnits.length > 0) {
                            return { ...d, Units: matchingUnits };
                        } else {
                            return null;
                        }
                    }

                    return d;
                }).filter(d => d !== null);

                renderDocs(filtered);
            }

            docSearch.addEventListener('input', filterAndRenderDocs);
            docDimFilter.addEventListener('change', filterAndRenderDocs);

            document.getElementById('clearSearchBtn').onclick = () => {
                docSearch.value = '';
                filterAndRenderDocs();
                docSearch.focus();
            };

            document.getElementById('clearDimBtn').onclick = () => {
                docDimFilter.value = 'all';
                filterAndRenderDocs();
            };
            docDimFilter.addEventListener('change', filterAndRenderDocs);

            function renderDocs(docs) {
                docsBody.innerHTML = '';

                if (docs.length === 0) {
                    docsBody.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 2rem;">No matching units found.</div>';
                    return;
                }

                docs.forEach(q => {
                    const group = document.createElement('div');
                    group.className = 'doc-group';

                    const title = document.createElement('div');
                    title.className = 'doc-group-title interactable';
                    title.innerHTML = `${q.Name} <span style="font-size:0.8em; color:var(--text); font-weight:400; margin-left:0.5rem">${q.Description || ''}</span>`;
                    title.onclick = () => {
                        selectDimension(q.Name);
                        docsModal.style.display = 'none'; // Auto-close on select
                    };
                    group.appendChild(title);

                    q.Units.forEach(u => {
                        const item = document.createElement('div');
                        item.className = 'doc-item interactable';
                        const val = (u.Abbr && u.Abbr.length > 0) ? u.Abbr[0] : u.Name;
                        item.onclick = () => {
                            selectUnit(q.Name, val);
                            docsModal.style.display = 'none'; // Auto-close on select
                        };

                        const header = document.createElement('div');
                        header.style.display = 'flex';
                        header.style.alignItems = 'center';

                        const name = document.createElement('span');
                        name.className = 'doc-name';
                        name.textContent = u.Name;
                        header.appendChild(name);

                        if (u.Abbr && u.Abbr.length > 0) {
                            const abbr = document.createElement('span');
                            abbr.className = 'doc-abbr';
                            abbr.textContent = u.Abbr.join(', ');
                            header.appendChild(abbr);
                        }

                        item.appendChild(header);

                        if (u.Plural && u.Plural !== u.Name) {
                            const plural = document.createElement('div');
                            plural.className = 'doc-desc';
                            plural.textContent = `Plural: ${u.Plural}`;
                            item.appendChild(plural);
                        }

                        group.appendChild(item);
                    });
                    docsBody.appendChild(group);
                });
            }

            // Enable Docs button when ready
            docsBtn.disabled = false;

            // Scroll Top Logic
            const docsBodyEl = document.getElementById('docsBody');
            const scrollTopBtn = document.getElementById('scrollTopBtn');

            if (docsBodyEl && scrollTopBtn) {
                docsBodyEl.addEventListener('scroll', () => {
                    if (docsBodyEl.scrollTop > 300) {
                        scrollTopBtn.classList.add('visible');
                    } else {
                        scrollTopBtn.classList.remove('visible');
                    }
                });

                scrollTopBtn.addEventListener('click', () => {
                    docsBodyEl.scrollTo({ top: 0, behavior: 'smooth' });
                });
            }
        </script>
</body>
